<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CivicEvents administration dashboard.">
  <title>Admin dashboard | CivicEvents</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="admin-main" class="admin-shell" tabindex="-1">
    <aside class="admin-sidebar" aria-label="Administration navigation">
      <span class="eyebrow">CivicEvents</span>
      <nav class="admin-nav">
        <a href="admin-dashboard.html" aria-current="page">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="announcements.html">Announcements</a>
        <a href="promos.html">Promos</a>
        <a href="notifications.html">Notifications</a>
        <a href="admin-users.html">Users</a>
      </nav>
    </aside>
    <section class="admin-content">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Administration</p>
          <h1>Dashboard</h1>
        </div>
      </div>
      <div id="dashboard-status" class="section-status" role="status" aria-live="polite"></div>
      <div id="dashboard-metrics" class="metric-grid"></div>
      <section class="dashboard-users" aria-labelledby="dashboard-users-heading">
        <div class="section-heading">
          <h2 id="dashboard-users-heading">Users</h2>
          <a class="button button-secondary" href="admin-users.html">Manage users</a>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="dashboard-users-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-region" class="loading-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
