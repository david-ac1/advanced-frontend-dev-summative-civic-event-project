<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage CivicEvents users.">
  <title>User management | CivicEvents</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="admin-main" class="admin-shell" tabindex="-1">
    <aside class="admin-sidebar" aria-label="Administration navigation">
      <span class="eyebrow">CivicEvents</span>
      <nav class="admin-nav">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="announcements.html">Announcements</a>
        <a href="promos.html">Promos</a>
        <a href="notifications.html">Notifications</a>
        <a href="admin-users.html" aria-current="page">Users</a>
      </nav>
    </aside>
    <section class="admin-content">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Administration</p>
          <h1>Users</h1>
        </div>
      </div>
      <div id="users-status" class="section-status" role="status" aria-live="polite"></div>
      <section class="dashboard-users" aria-labelledby="users-table-heading">
        <h2 id="users-table-heading" class="sr-only">User management table</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </section>
      <nav id="users-pagination" class="pagination" aria-label="User pagination" hidden></nav>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-region" class="loading-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
