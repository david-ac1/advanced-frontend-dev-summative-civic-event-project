<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to CivicEvents.">
  <title>Sign in | CivicEvents</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <main class="auth-page" tabindex="-1">
    <section class="auth-card" aria-labelledby="login-heading">
      <a class="brand auth-brand" href="index.html">CivicEvents</a>
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-heading">Sign in to your account</h1>
      <p class="auth-intro">Keep up with events and opportunities in your community.</p>

      <div id="auth-message" class="form-message" role="status" aria-live="polite" hidden></div>
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required>
          <span class="field-error" data-error-for="login-email"></span>
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <span class="field-error" data-error-for="login-password"></span>
        </div>
        <button class="button button-primary button-wide" type="submit">Sign in</button>
      </form>
      <p class="auth-footer">New to CivicEvents? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-region" class="loading-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/auth-pages.js"></script>
</body>
</html>
