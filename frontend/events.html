<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse upcoming CivicEvents.">
  <title>Events | CivicEvents</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="app-main" class="page-shell" tabindex="-1">
    <div class="page-heading">
      <div>
        <p class="eyebrow">Community calendar</p>
        <h1>Upcoming events</h1>
        <p class="page-intro">Find ways to connect, learn, and make a difference in your community.</p>
      </div>
      <div class="page-heading-actions">
        <a id="create-event-link" class="button button-primary" href="admin-event-form.html" hidden>Create event</a>
        <a class="button button-secondary" href="my-registrations.html">My registrations</a>
      </div>
    </div>

    <form id="event-filters" class="filter-panel" novalidate>
      <div class="form-field">
        <label for="event-search">Search events</label>
        <input id="event-search" type="search" placeholder="Search by title or description">
      </div>
      <div class="form-field">
        <label for="event-location">Location</label>
        <input id="event-location" type="search" placeholder="Any location">
      </div>
      <div class="form-field">
        <label for="event-date">Date</label>
        <input id="event-date" type="date">
      </div>
      <button class="button button-primary" type="submit">Apply filters</button>
      <button id="clear-event-filters" class="button button-secondary" type="button">Clear</button>
    </form>

    <div id="events-status" class="section-status" role="status" aria-live="polite"></div>
    <div id="events-grid" class="event-grid"></div>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-region" class="loading-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/events.js"></script>
</body>
</html>
