<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your CivicEvents registrations.">
  <title>My registrations | CivicEvents</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="app-main" class="page-shell" tabindex="-1">
    <div class="page-heading">
      <div>
        <p class="eyebrow">Your calendar</p>
        <h1>My registrations</h1>
        <p class="page-intro">Keep track of the events you have joined.</p>
      </div>
      <a class="button button-secondary" href="events.html">Browse events</a>
    </div>
    <div id="registrations-status" class="section-status" role="status" aria-live="polite"></div>
    <div id="registrations-list" class="registration-list"></div>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-region" class="loading-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/events.js"></script>
</body>
</html>
