<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create or edit a CivicEvents event.">
  <title>Manage event | CivicEvents</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="app-main" class="page-shell" tabindex="-1">
    <a class="back-link" href="events.html">← Back to events</a>
    <section class="form-panel" aria-labelledby="event-form-heading">
      <p class="eyebrow">Admin tools</p>
      <h1 id="event-form-heading">Create event</h1>
      <p class="page-intro">Publish an accessible activity for the community.</p>
      <div id="event-form-message" class="form-message" role="status" aria-live="polite" hidden></div>
      <form id="event-form" class="admin-form" novalidate>
        <div class="form-field">
          <label for="event-title">Title</label>
          <input id="event-title" type="text" required>
          <span class="field-error" data-error-for="event-title"></span>
        </div>
        <div class="form-field">
          <label for="event-description">Description</label>
          <textarea id="event-description" rows="5"></textarea>
          <span class="field-error" data-error-for="event-description"></span>
        </div>
        <div class="form-field">
          <label for="event-location">Location</label>
          <input id="event-location" type="text" required>
          <span class="field-error" data-error-for="event-location"></span>
        </div>
        <div class="form-field">
          <label for="event-starts">Starts at</label>
          <input id="event-starts" type="datetime-local" required>
          <span class="field-error" data-error-for="event-starts"></span>
        </div>
        <div class="form-field">
          <label for="event-ends">Ends at</label>
          <input id="event-ends" type="datetime-local" required>
          <span class="field-error" data-error-for="event-ends"></span>
        </div>
        <div class="form-field">
          <label for="event-image">Event image <span class="muted-label">(JPG, JPEG, PNG, or GIF; max 2 MB)</span></label>
          <input id="event-image" type="file" accept=".jpg,.jpeg,.png,.gif,image/*">
          <img id="event-image-preview" class="event-image-preview" alt="" hidden>
          <span id="event-image-name" class="muted-label">No file selected.</span>
          <span class="field-error" data-error-for="event-image"></span>
        </div>
        <label class="checkbox-field">
          <input id="event-published" type="checkbox" checked>
          <span>Published</span>
        </label>
        <div class="form-actions">
          <a class="button button-secondary" href="events.html">Cancel</a>
          <button class="button button-primary" type="submit">Save event</button>
        </div>
      </form>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-region" class="loading-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/events.js"></script>
</body>
</html>
